# Four jobs so backend, web, the evaluation checks and the cluster fail independently and run in parallel.
name: ci

on:
  push:
    branches: [main]
  # All pull requests; concurrency below cancels superseded runs so a fast push does not queue behind itself.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tally
          POSTGRES_PASSWORD: tally
          POSTGRES_DB: tally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TALLY_TEST_DB_URL: jdbc:postgresql://localhost:5432/tally_test?user=tally&password=tally
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # One invocation runs unit and integration tests and shades the jar in the package phase. The
      # postgres service is up for the whole job, so a separate unit-only pass would run the same tests twice.
      - run: ./mvnw -B -Pintegration verify

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test --if-present
      - run: npm run build

  # The model check, the Python tests for the fraud verifiers, and the drift check between the README, the
  # demo's data and the results files. No cluster and no model server needed.
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install z3-solver==5.1.0.0
      # Exits non-zero unless the real protocol passes and the model without the key check fails.
      - name: TLC on the ledger model
        run: python spec/check.py
      - run: python -m unittest discover -s eval/fraud/tests -v
      - name: README and site data match eval/
        run: python -m unittest discover -s eval/tests -v

  # The Kubernetes proof: a kind cluster built from the same script a developer runs, the four deployment
  # gates, the fault gate, then the existing integration suite against the Postgres inside the cluster.
  k8s:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OVERLAY: ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install kind and kubeconform
        run: |
          curl -sSLo kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/kubeconform
          kind version && kubectl version --client
      - name: Validate both overlays against the Kubernetes schemas
        run: |
          for overlay in local ci; do
            kubectl kustomize "deploy/k8s/overlays/$overlay" | kubeconform -strict -summary -kubernetes-version 1.33.0
          done
      # Fresh random values for this run only, masked in the log, never stored.
      - name: Write a throwaway .env
        run: |
          password="$(openssl rand -hex 24)"
          token="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "::add-mask::$token"
          {
            echo "POSTGRES_PASSWORD=$password"
            echo "TALLY_API_TOKEN=$token"
          } > .env
      - name: Create the cluster, build and load the image, apply, wait
        run: ./scripts/k8s-up.sh
      - name: Four deployment gates
        run: ./scripts/k8s-gates.sh
      # The fifth gate: pod kills, a Postgres restart, a partition, clock skew and dropped responses under
      # concurrent transfers, then the books are checked. Its results are uploaded, not committed from CI.
      - name: Fault gate
        run: ./scripts/k8s-faults.sh --where "kind on a GitHub ubuntu-latest runner" --out "$RUNNER_TEMP/faults"
      - name: Fault results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fault-results
          path: ${{ runner.temp }}/faults
          if-no-files-found: ignore
      - name: Integration tests against the cluster's Postgres
        run: |
          password="$(grep -E '^POSTGRES_PASSWORD=' .env | cut -d= -f2-)"
          kubectl -n tally exec tally-db-0 -- psql -U tally -d tally -c 'CREATE DATABASE tally_test'
          # Not kubectl port-forward: PoolTest kills backends with pg_terminate_backend, the reset stream
          # makes port-forward exit, and every later database test then gets connection refused. A
          # test-only NodePort on the kind node's own address has no process in between to lose.
          kubectl -n tally expose pod tally-db-0 --name=tally-db-tests --type=NodePort --port=5432 --target-port=5432
          node_port="$(kubectl -n tally get service tally-db-tests -o jsonpath='{.spec.ports[0].nodePort}')"
          node_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' tally-control-plane)"
          for _ in $(seq 1 30); do (echo > "/dev/tcp/$node_ip/$node_port") 2>/dev/null && break; sleep 1; done
          export TALLY_TEST_DB_URL="jdbc:postgresql://$node_ip:$node_port/tally_test"
          export TALLY_TEST_DB_PASSWORD="$password"
          ./mvnw -B -Pintegration verify
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl -n tally get all,pdb,hpa,pvc -o wide || true
          kubectl -n tally describe pods || true
          kubectl -n tally logs job/tally-migrate --tail=100 || true
          kubectl -n tally logs -l app.kubernetes.io/name=tally-api --all-containers --tail=100 || true
