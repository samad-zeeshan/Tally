# Two jobs so backend and web fail independently and run in parallel.
name: ci

on:
  push:
    branches: [main]
  # All pull requests; concurrency below cancels superseded runs so a fast push does not queue behind itself.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tally
          POSTGRES_PASSWORD: tally
          POSTGRES_DB: tally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TALLY_TEST_DB_URL: jdbc:postgresql://localhost:5432/tally_test?user=tally&password=tally
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # One invocation runs unit and integration tests and shades the jar in the package phase. The
      # postgres service is up for the whole job, so a separate unit-only pass would run the same tests twice.
      - run: ./mvnw -B -Pintegration verify

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test --if-present
      - run: npm run build
