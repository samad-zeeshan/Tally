# One Postgres with its own volume. Headless, so the API reaches the pod by a stable DNS name.
apiVersion: v1
kind: Service
metadata:
  name: tally-db
  labels:
    app.kubernetes.io/name: tally-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: tally-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tally-db
  labels:
    app.kubernetes.io/name: tally-db
spec:
  serviceName: tally-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tally-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tally-db
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: tally
            - name: POSTGRES_USER
              value: tally
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tally-secrets
                  key: POSTGRES_PASSWORD
            # A fresh volume can hold lost+found at its root, and initdb refuses a non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "tally", "-d", "tally"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "tally", "-d", "tally"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
