# The Java service, which also serves the built web client at the same origin (ADR-0020).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tally-api
  labels:
    app.kubernetes.io/name: tally-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tally-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tally-api
    spec:
      initContainers:
        # Blocks until every migration file in this image is recorded in schema_version. It only reads,
        # so any number of pods can wait at once while the Job does the writing.
        - name: await-migrations
          image: tally
          imagePullPolicy: IfNotPresent
          command: ["java", "-cp", "app.jar", "dev.tally.ops.Migrate", "--await"]
          envFrom:
            - configMapRef:
                name: tally-config
          env:
            - name: TALLY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tally-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: api
          image: tally
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tally-config
          env:
            - name: TALLY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tally-secrets
                  key: POSTGRES_PASSWORD
            - name: TALLY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tally-secrets
                  key: TALLY_API_TOKEN
          # Both probes hit /health, which never touches the database. A readiness check on Postgres would
          # drop every pod from the Service during a database blip and turn it into a full outage.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: tally-api
  labels:
    app.kubernetes.io/name: tally-api
spec:
  selector:
    app.kubernetes.io/name: tally-api
  ports:
    - name: http
      port: 8080
      targetPort: http
