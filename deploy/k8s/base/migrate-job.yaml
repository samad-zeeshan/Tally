# Applies db/migrations once, with the same runner the app uses. The API pods wait on the result in
# their init container, so this Job is what "migrate before serve" means here.
apiVersion: batch/v1
kind: Job
metadata:
  name: tally-migrate
  labels:
    app.kubernetes.io/name: tally-migrate
spec:
  backoffLimit: 4
  # Deleted ten minutes after it finishes, so re-applying the overlay creates and runs it again. That
  # is safe because the runner skips files already recorded.
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tally-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: tally
          imagePullPolicy: IfNotPresent
          command: ["java", "-cp", "app.jar", "dev.tally.ops.Migrate"]
          envFrom:
            - configMapRef:
                name: tally-config
          env:
            - name: TALLY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tally-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
