<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tally: a small money-movement demo. Every payment is written down twice, and sending it again still counts once." />
    <meta name="theme-color" content="#0f6b4f" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6b4f'/%3E%3Cpath d='M9 11h14M16 11v11' stroke='white' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Tally</title>
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      var stored = localStorage.getItem("tally-theme");
      document.documentElement.dataset.theme =
        stored || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <!--
      Added after the build, only to this copy under docs/. A fresh build drops these two tags, so
      they have to be put back by hand every time; docs/NOTES.md carries them verbatim.

      tally-server.js is a classic script that runs before the module below and answers the app's
      requests in the browser, so the page needs no server. It is a copy of Tally's rules, not the
      Java service.

      tally-embed.js reports this document's height to the page that frames it, so the frame grows to
      fit and never scrolls inside itself, and it takes back how far the frame falls below the reader's
      window so the toast shelf can lift itself into view. Outside a frame it does nothing.
    -->
    <script src="./tally-server.js"></script>
    <script src="./tally-embed.js"></script>
    <script type="module" crossorigin src="./assets/index-Sm-2pL0u.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-23Dpc2EK.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
