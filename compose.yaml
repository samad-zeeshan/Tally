# Dev and test database. The app service joins this same file in the container work.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: tally
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: tally
    ports:
      - "5432:5432"
    volumes:
      - tally_pgdata:/var/lib/postgresql/data
      - ./db/compose-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tally -d tally"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  tally_pgdata:
