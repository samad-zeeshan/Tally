\* The same model with the idempotency check removed. TLC is expected to find a double application here.
CONSTANTS
    World = "w"
    Accounts = {"a", "b"}
    Clients = {"c1", "c2", "c3"}
    Workers = {"w1", "w2"}
    Transfer <- MCTransfer
    Opening <- MCOpening
    MaxFaults = 3
    MaxEagerRetries = 2
    SkipKeyCheck = TRUE

SPECIFICATION Spec

INVARIANTS
    Conservation
    PostingsSumToZero
    NoNegativeBalance
    Reconciles
    ExactlyOnce
