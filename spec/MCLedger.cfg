\* The real protocol: every invariant and the liveness property must hold.
CONSTANTS
    World = "w"
    Accounts = {"a", "b"}
    Clients = {"c1", "c2", "c3"}
    Workers = {"w1", "w2"}
    Transfer <- MCTransfer
    Opening <- MCOpening
    MaxFaults = 3
    MaxEagerRetries = 2
    SkipKeyCheck = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Conservation
    PostingsSumToZero
    NoNegativeBalance
    Reconciles
    ExactlyOnce
    NoPhantom
    AnswerMatchesBook

PROPERTIES
    EveryClientAnswered
